<!-- same HEAD & styles as before -->
<body>

  <div class="wheel-container">
    <canvas id="wheel" width="500" height="500"></canvas>
    <div class="pointer"></div>
  </div>
  <button id="spinButton">Spin the Wheel</button>

  <div id="popup">
    <p>🎉 You've spun 10 times!</p>
    <img src="picture.png" alt="Popup Image" />
  </div>

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const popup = document.getElementById("popup");

    const segments = [
      "15 Juli", "20 Juli", "2 August", "15 August",
      "18 August", "20 August", "26 August", "29 August", "02 September"
    ];

    const pastelColors = [
      "#FFCDD2", "#F8BBD0", "#E1BEE7", "#D1C4E9",
      "#C5CAE9", "#B2DFDB", "#C8E6C9", "#FFF9C4", "#FFE0B2"
    ];

    let anglePerSegment = (2 * Math.PI) / segments.length;
    let rotation = 0;
    let totalSpins = 0;

    function drawWheel() {
      for (let i = 0; i < segments.length; i++) {
        ctx.beginPath();
        ctx.moveTo(250, 250);
        ctx.fillStyle = pastelColors[i % pastelColors.length];
        ctx.arc(250, 250, 250, anglePerSegment * i, anglePerSegment * (i + 1));
        ctx.lineTo(250, 250);
        ctx.fill();

        // Draw text
        ctx.save();
        ctx.translate(250, 250);
        ctx.rotate(anglePerSegment * (i + 0.5));
        ctx.textAlign = "right";
        ctx.fillStyle = "#333";
        ctx.font = "18px sans-serif";
        ctx.fillText(segments[i], 230, 10);
        ctx.restore();
      }
    }

    drawWheel();

    function spinWheel() {
      spinButton.disabled = true; // Disable after one click
      let spinDegrees = Math.floor(Math.random() * 360) + 1440;
      let spinRadians = spinDegrees * Math.PI / 180;
      let start = rotation;
      let end = rotation + spinRadians;
      let duration = 3000;
      let startTime = null;

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        let progress = timestamp - startTime;
        let easeOut = 1 - Math.pow(1 - progress / duration, 3);
        rotation = start + (end - start) * easeOut;
        ctx.clearRect(0, 0, 500, 500);
        ctx.save();
        ctx.translate(250, 250);
        ctx.rotate(rotation);
        ctx.translate(-250, -250);
        drawWheel();
        ctx.restore();

        if (progress < duration) {
          requestAnimationFrame(animate);
        } else {
          totalSpins++;
          if (totalSpins === 10) {
            popup.style.display = "block";
          }
        }
      }

      requestAnimationFrame(animate);
    }

    spinButton.addEventListener("click", spinWheel);
  </script>

</body>
</html>
