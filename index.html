<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fixed Prize Wheel</title>
  <style>
    body {
      background: #fefefe;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .wheel-container {
      position: relative;
      width: 500px;
      height: 500px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .pointer {
      position: absolute;
      top: 50%;
      left: 500px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-left: 20px solid #333;
    }

    #spinButton {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 20px;
      cursor: pointer;
    }

    #popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #333;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      text-align: center;
      z-index: 10;
    }

    #popup img {
      width: 300px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="wheel-container">
    <canvas id="wheel" width="500" height="500"></canvas>
    <div class="pointer"></div>
  </div>
  <button id="spinButton">Spin the Wheel</button>

  <div id="popup">
    <p>🎉💖 Surprise! You landed on <strong>15 August</strong>! 💖🎆</p>
    <img src="picture.png" alt="Celebration" />
  </div>

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const popup = document.getElementById("popup");

    const segments = [
      "15 Juli", "20 Juli", "2 August", "15 August",
      "18 August", "20 August", "26 August", "29 August", "02 September"
    ];

    const pastelColors = [
      "#FFCDD2", "#F8BBD0", "#E1BEE7", "#D1C4E9",
      "#C5CAE9", "#B2DFDB", "#C8E6C9", "#FFF9C4", "#FFE0B2"
    ];

    const segmentAngle = (2 * Math.PI) / segments.length;
    let rotation = 0;
    let hasSpun = false;

    function drawWheel() {
      for (let i = 0; i < segments.length; i++) {
        ctx.beginPath();
        ctx.moveTo(250, 250);
        ctx.fillStyle = pastelColors[i % pastelColors.length];
        ctx.arc(250, 250, 250, segmentAngle * i, segmentAngle * (i + 1));
        ctx.lineTo(250, 250);
        ctx.fill();

        // Text
        ctx.save();
        ctx.translate(250, 250);
        ctx.rotate(segmentAngle * (i + 0.5));
        ctx.textAlign = "right";
        ctx.fillStyle = "#333";
        ctx.font = "18px sans-serif";
        ctx.fillText(segments[i], 230, 10);
        ctx.restore();
      }
    }

    drawWheel();

    function spinWheel() {
      if (hasSpun) return;
      hasSpun = true;
      spinButton.disabled = true;

      const targetSegment = 3; // "15 August"
      const fullSpins = 5; // Total full spins before landing
      const targetRotation = (segments.length - targetSegment) * segmentAngle;
      const totalRotation = (2 * Math.PI * fullSpins) + targetRotation;

      let start = rotation;
      let duration = 3000;
      let startTime = null;

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = timestamp - startTime;
        const easeOut = 1 - Math.pow(1 - progress / duration, 4);
        rotation = start + (totalRotation - start) * easeOut;

        ctx.clearRect(0, 0, 500, 500);
        ctx.save();
        ctx.translate(250, 250);
        ctx.rotate(rotation);
        ctx.translate(-250, -250);
        drawWheel();
        ctx.restore();

        if (progress < duration) {
          requestAnimationFrame(animate);
        } else {
          popup.style.display = "block";
        }
      }

      requestAnimationFrame(animate);
    }

    spinButton.addEventListener("click", spinWheel);
  </script>

</body>
</html>
